name: Publish Core Package

on:
  push:
    tags:
      - '2.0.*'
      - '2.1.*'
      - '!2.1.*-patch'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Run server type check
        run: npm run typecheck

      - name: Run core type check
        run: npm run typecheck:core

      - name: Run tests with coverage
        run: npm run test-coverage
        env:
          NODE_ENV: test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Build TypeScript packages
        run: npm run build:ts

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Verify package version and select dist-tag
        id: release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          PACKAGE_VERSION="$(node -p "require('./packages/core/package.json').version")"

          case "$TAG_VERSION" in
            2.0.*)
              # Normal release: package.json must match the tag; published as "latest"
              if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
                echo "Tag version ($TAG_VERSION) does not match @app-connect/core version ($PACKAGE_VERSION)."
                exit 1
              fi
              if [[ "$TAG_VERSION" == *-* ]]; then
                echo "2.0.* tags must be normal versions (no prerelease suffix): $TAG_VERSION"
                exit 1
              fi
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
            2.1.*)
              # Beta release: tag 2.1.N publishes 2.1.0-beta.N under the "beta" dist-tag.
              # The version is stamped at publish time; package.json is not read or committed.
              if [[ ! "$TAG_VERSION" =~ ^2\.1\.([0-9]+)$ ]]; then
                echo "2.1.* tags must look like 2.1.<number>: $TAG_VERSION"
                exit 1
              fi
              BETA_VERSION="2.1.0-beta.${BASH_REMATCH[1]}"
              npm pkg set version="$BETA_VERSION" --workspace=@app-connect/core
              echo "Publishing $BETA_VERSION (from tag $TAG_VERSION)"
              echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: $TAG_VERSION"
              exit 1
              ;;
          esac

      - name: Publish @app-connect/core
        run: npm publish --workspace=@app-connect/core --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
